<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Scheduler Pre v2 — Staff + STSO</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <link rel="stylesheet" href="css/styles.css?v=20260902i" />
  <link rel="stylesheet" href="css/line-print.css?v=20260902i" />
</head>
<body>
  <header class="topbar">
    <div class="brand">Scheduler <span>Pre v2</span></div>
    <div class="topbar-actions">
      <button class="btn" id="btn-airport-config">Airport Config</button>
      <button class="btn btn-amber" id="btn-generate">Generate</button>
      <button class="btn" id="btn-export">Export JSON</button>
      <button class="btn" id="btn-import">Import JSON</button>
      <input type="file" id="file-import" accept="application/json,.json" style="display:none" />
      <button class="btn btn-red" id="btn-clear">Clear</button>
    </div>
  </header>

  <div class="status" id="status">Loading…</div>

  <nav class="tabs">
    <button class="tab-btn active" data-tab="setup">① Setup</button>
    <button class="tab-btn" data-tab="coverage">② Coverage</button>
    <button class="tab-btn" data-tab="lines">③ Lines</button>
    <button class="tab-btn" data-tab="teams">④ Teams</button>
    <button class="tab-btn" data-tab="reports">⑤ Reports</button>
  </nav>

  <main>
    <section class="panel active" id="tab-setup"></section>
    <section class="panel" id="tab-coverage"></section>
    <section class="panel" id="tab-lines"></section>
    <section class="panel" id="tab-teams">
      <div class="card">
        <div class="section-title">Team forming</div>
        <div class="toolbar">
          <button type="button" class="btn btn-amber" id="btn-team-new">+ New team</button>
          <button type="button" class="btn btn-amber" id="btn-team-build">Build</button>
          <span class="muted" id="team-count-hint">No teams yet</span>
        </div>
        <div class="toolbar team-arch-bar" id="team-architecture">
          <label>STSO <input type="number" id="arch-stso" min="0" max="20" value="1" style="width:3.5rem"></label>
          <label>LTSO <input type="number" id="arch-ltso" min="0" max="20" value="1" style="width:3.5rem"></label>
          <label>TSO <input type="number" id="arch-tso" min="0" max="50" value="6" style="width:3.5rem"></label>
          <button type="button" class="btn btn-amber" id="btn-team-auto-form">Auto-form teams</button>
          <span class="muted" id="arch-hint"></span>
        </div>
        <div class="toolbar" id="team-filters"></div>
      </div>
      <div class="card">
        <div class="section-title">Unassigned pool</div>
        <div id="team-pool" class="team-pool"></div>
      </div>
      <div class="card" id="team-boards-card">
        <div class="section-title"><span>Teams</span>
          <button type="button" class="btn btn-amber" id="btn-team-new-2">+ New team</button>
        </div>
        <div id="team-boards" class="team-boards"></div>
      </div>
    </section>
    <section class="panel" id="tab-reports"></section>
  </main>

  <div id="team-follow-docks" class="team-follow-docks" hidden>
    <div id="team-stats-dock" class="team-float-panel team-stats-dock card" data-float="stats">
      <div class="float-panel-head" data-drag-handle>
        <span class="section-title" style="margin:0">Assignment</span>
        <button type="button" class="btn btn-sm" id="btn-build-close" title="Close assignment">✕</button>
      </div>
      <div id="team-stats-body" class="team-stats-body"></div>
    </div>
    <div id="team-boards-dock" class="team-float-panel team-boards-dock card" data-float="boards">
      <div class="float-panel-head" data-drag-handle>
        <span class="section-title" style="margin:0">Teams</span>
        <button type="button" class="btn btn-amber btn-sm" id="btn-team-new-dock">+ New</button>
      </div>
      <div id="team-boards-follow" class="team-boards team-boards-follow"></div>
    </div>
  </div>

  <div id="team-detail-modal" class="modal">
    <div class="modal-content" style="max-width:720px">
      <span class="modal-close" id="team-detail-close">&times;</span>
      <div class="modal-header"><h2 class="modal-title" id="team-detail-title">Team Details</h2></div>
      <div id="team-detail-content"></div>
    </div>
  </div>

  <script src="lib/dayjs.min.js?v=20260902i"></script>
  <script src="lib/Sortable.min.js?v=20260902i"></script>
  <script src="lib/luxon.min.js?v=20260902i"></script>
  <script src="lib/exceljs.min.js?v=20260902i"></script>
  <script src="js/constants.js?v=20260902i"></script>
  <script src="js/state.js?v=20260902i"></script>
  <script src="js/utils.js?v=20260902i"></script>
  <script src="js/shifts.js?v=20260902i"></script>
  <script src="js/allocation.js?v=20260902i"></script>
  <script src="js/functions.js?v=20260902i"></script>
  <script src="js/render.js?v=20260902i"></script>
  <script src="js/line-colors.js?v=20260902i"></script>
  <script src="js/reports.js?v=20260902i"></script>
  <script src="js/schedule.js?v=20260902i"></script>
  <script src="js/io.js?v=20260902i"></script>
  <script src="js/airport.js?v=20260902i"></script>
  <script src="js/teams.js?v=20260902i"></script>
  <script src="js/main.js?v=20260902i"></script>
</body>
</html>
