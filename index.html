<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Scheduler Pre v2 — Staff + STSO</title>
  <link rel="stylesheet" href="css/styles.css?v=20260902c" />
  <link rel="stylesheet" href="css/line-print.css?v=20260902c" />
</head>
<body>
  <header class="topbar">
    <div class="brand">Scheduler <span>Pre v2</span></div>
    <div class="topbar-actions">
      <button class="btn" id="btn-airport-config">Airport Config</button>
      <button class="btn btn-amber" id="btn-generate">Generate</button>
      <button class="btn" id="btn-export">Export JSON</button>
      <button class="btn" id="btn-import">Import JSON</button>
      <input type="file" id="file-import" accept="application/json,.json" style="display:none" />
      <button class="btn btn-red" id="btn-clear">Clear</button>
    </div>
  </header>
  <div class="status" id="status">Loading…</div>
  <nav class="tabs">
    <button class="tab-btn active" data-tab="setup">1 Setup</button>
    <button class="tab-btn" data-tab="coverage">2 Coverage</button>
    <button class="tab-btn" data-tab="lines">3 Lines</button>
    <button class="tab-btn" data-tab="teams">4 Teams</button>
    <button class="tab-btn" data-tab="reports">5 Reports</button>
  </nav>
  <main>
    <section class="panel active" id="tab-setup"></section>
    <section class="panel" id="tab-coverage"></section>
    <section class="panel" id="tab-lines">
      <div class="card">
        <div class="section-title">Bid lines</div>
        <div class="toolbar" id="lines-toolbar">
          <button type="button" class="btn btn-amber" id="btn-export-lines-excel">Print / Excel</button>
        </div>
        <div class="lines-scroll lines-scroll-wide">
          <table class="data-table lines-editable">
            <thead id="lines-thead"></thead>
            <tbody id="lines-tbody"></tbody>
          </table>
        </div>
      </div>
    </section>
    <section class="panel" id="tab-teams"></section>
    <section class="panel" id="tab-reports"></section>
  </main>
  <script src="lib/dayjs.min.js?v=20260902c"></script>
  <script src="lib/Sortable.min.js?v=20260902c"></script>
  <script src="lib/luxon.min.js?v=20260902c"></script>
  <script src="lib/exceljs.min.js?v=20260902c"></script>
  <script src="js/constants.js?v=20260902c"></script>
  <script src="js/state.js?v=20260902c"></script>
  <script src="js/utils.js?v=20260902c"></script>
  <script src="js/shifts.js?v=20260902c"></script>
  <script src="js/allocation.js?v=20260902c"></script>
  <script src="js/functions.js?v=20260902c"></script>
  <script src="js/render.js?v=20260902c"></script>
  <script src="js/reports.js?v=20260902c"></script>
  <script src="js/schedule.js?v=20260902c"></script>
  <script src="js/io.js?v=20260902c"></script>
  <script src="js/airport.js?v=20260902c"></script>
  <script src="js/teams.js?v=20260902c"></script>
  <script src="js/main.js?v=20260902c"></script>
</body>
</html>
