<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Scheduler Pre v2 — Staff + STSO</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">Scheduler <span>Pre v2</span></div>
    <div class="topbar-actions">
      <button class="btn" id="btn-airport-config">Airport Config</button>
      <button class="btn btn-amber" id="btn-generate">Generate</button>
      <button class="btn" id="btn-export">Export JSON</button>
      <button class="btn" id="btn-import">Import JSON</button>
      <input type="file" id="file-import" accept="application/json,.json" style="display:none" />
      <button class="btn btn-red" id="btn-clear">Clear</button>
    </div>
  </header>

  <div class="status" id="status">Loading…</div>

  <nav class="tabs">
    <button class="tab-btn active" data-tab="setup">① Setup</button>
    <button class="tab-btn" data-tab="coverage">② Coverage</button>
    <button class="tab-btn" data-tab="lines">③ Lines</button>
    <button class="tab-btn" data-tab="teams">④ Teams</button>
    <button class="tab-btn" data-tab="reports">⑤ Reports</button>
  </nav>

  <main>
    <!-- content panels omitted for brevity in this message - full file was uploaded via zip; re-upload full from local if needed -->
    <section class="panel active" id="tab-setup">
      <div class="card">
        <div class="section-title">What this is</div>
        <p class="muted">v2 staffing balancer. FT / PT are operational TSO. LTSO/STSO are management.</p>
      </div>
    </section>
  </main>

  <script src="lib/dayjs.min.js"></script>
  <script src="lib/Sortable.min.js"></script>
  <script src="lib/luxon.min.js"></script>
  <script src="js/constants.js"></script>
  <script src="js/state.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/shifts.js"></script>
  <script src="js/allocation.js"></script>
  <script src="js/functions.js"></script>
  <script src="js/render.js"></script>
  <script src="js/reports.js"></script>
  <script src="js/schedule.js"></script>
  <script src="js/io.js"></script>
  <script src="js/airport.js"></script>
  <script src="js/teams.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
