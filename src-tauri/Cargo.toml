[package]
name = "brokesched"
version = "0.2.0"
description = "BrokeSched — offline airport staffing scheduler"
authors = ["dad2lna"]
edition = "2021"

[lib]
name = "brokesched_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
